# Environment uat: the port comes from SERVER_PORT in /etc/lms/uat.env (see deploy/).
spring.datasource.url=jdbc:h2:file:/var/lib/lms/uat/db;IGNORECASE=TRUE
file.upload-dir=/var/lib/lms/uat/uploads
spring.h2.console.enabled=false
# Recreate the schema on every start: Newman data left duplicates that made the bootstrapper fail on restart.
spring.jpa.hibernate.ddl-auto=create
