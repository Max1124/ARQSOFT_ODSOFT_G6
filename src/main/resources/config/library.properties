# Lending configuration
fineValuePerDayInCents=200

# Lending policy parameters (specification section 5); validated at startup, an invalid value stops the application.
# Standard policy (2.1-2.3). Max active lendings and lending period keep the previous behaviour (3 and 15 days).
lending.standard.max-active-lendings=3
lending.standard.lending-period-days=15
# Placeholder values, not specified by the faculty: renewals are not implemented yet.
lending.standard.max-renewals=2
lending.standard.renewal-period-days=7

# Adaptive policy (3.1-3.5). Placeholder values, not specified by the faculty.
# Constraints: 0 < first-threshold < second-threshold < max-active-lendings; long > standard > short > 0.
lending.adaptive.max-active-lendings=5
lending.adaptive.first-threshold=2
lending.adaptive.second-threshold=4
lending.adaptive.long-period-days=21
lending.adaptive.standard-period-days=15
lending.adaptive.short-period-days=7

# Policy selection (4.2). Placeholder values, not specified by the faculty.
lending.selection.history-period-months=6
lending.selection.min-completed-lendings=5
lending.selection.min-on-time-ratio-percent=90

# Notification channels (CFG-NOT-01): enabled channel identifiers, comma separated, read at startup.
# Installed: email, sms, webhook. At least one is required; an empty, unknown or repeated identifier stops startup.
notification.channels=email,sms,webhook
# Delivery settings of the enabled channels; required only for enabled channels.
# Placeholder values: each installation sets its own SMTP server and SMS gateway.
# Email (SMTP): host, port and sender address are required; username/password only if the server needs them.
notification.email.smtp.host=localhost
notification.email.smtp.port=1025
notification.email.smtp.username=${NOTIFICATION_SMTP_USERNAME:}
notification.email.smtp.password=${NOTIFICATION_SMTP_PASSWORD:}
notification.email.from=library@localhost
# SMS (SMS Gateway for Android, local server mode): all values are required when sms is enabled.
# Gateway URL: the phone's local IP shown in the app, port 8080, path /message (placeholder IP below).
# Username and password are the basic-auth credentials shown in the app, set as environment variables.
# The country code is prefixed to the readers' 9-digit phone numbers.
notification.sms.gateway-url=${NOTIFICATION_SMS_GATEWAY_URL:http://192.168.1.100:8080/message}
notification.sms.username=${NOTIFICATION_SMS_USERNAME:}
notification.sms.password=${NOTIFICATION_SMS_PASSWORD:}
notification.sms.country-code=+351
# Webhook: no setup value; each reader provides their own URL with their channel choice.
# Days before the limit date on which the due-date notification is sent (US6); must be > 0.
notification.due-date-notice-days=3
# Schedule of the due-date and overdue check (Spring cron: second minute hour day month weekday); daily at 09:00.
# "-" disables the check; a malformed expression stops startup.
notification.check.cron=0 0 9 * * *

# Reader configuration
minimumReaderAge=12

# Book suggestions configuration
suggestionsLimitPerGenre=2
