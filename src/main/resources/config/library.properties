# Lending configuration
fineValuePerDayInCents=200

# Lending policy parameters (specification section 5); validated at startup, an invalid value stops the application.
# Standard policy (2.1-2.3). Max active lendings and lending period keep the previous behaviour (3 and 15 days).
lending.standard.max-active-lendings=3
lending.standard.lending-period-days=15
# Placeholder values, not specified by the faculty: renewals are not implemented yet.
lending.standard.max-renewals=2
lending.standard.renewal-period-days=7

# Adaptive policy (3.1-3.5). Placeholder values, not specified by the faculty.
# Constraints: 0 < first-threshold < second-threshold < max-active-lendings; long > standard > short > 0.
lending.adaptive.max-active-lendings=5
lending.adaptive.first-threshold=2
lending.adaptive.second-threshold=4
lending.adaptive.long-period-days=21
lending.adaptive.standard-period-days=15
lending.adaptive.short-period-days=7

# Policy selection (4.2). Placeholder values, not specified by the faculty.
lending.selection.history-period-months=6
lending.selection.min-completed-lendings=5
lending.selection.min-on-time-ratio-percent=90

# Reader configuration
minimumReaderAge=12

# Book suggestions configuration
suggestionsLimitPerGenre=2
